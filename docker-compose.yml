version: '3.8'

services:
  visionx:
    build: 
      context: .
      dockerfile: Dockerfile
    image: visionx:latest
    container_name: visionx
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-5000}:${CONTAINER_PORT:-5000}"
    environment:
      - PORT=${CONTAINER_PORT:-5000}
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    volumes:
      - ./logs:/app/logs
      - ./config/known_faces:/app/config/known_faces
      - ./config/models:/app/config/models
